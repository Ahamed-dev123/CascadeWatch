<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CascadeWatch — Multi-Hazard Cascade Risk Engine</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0a0e17;
    --bg2: #111827;
    --bg3: #1a2332;
    --border: #1e2d3d;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --accent: #38bdf8;
    --red: #ef4444;
    --orange: #f59e0b;
    --yellow: #eab308;
    --green: #22c55e;
    --critical-bg: rgba(239,68,68,0.12);
    --high-bg: rgba(245,158,11,0.12);
    --moderate-bg: rgba(234,179,8,0.12);
    --low-bg: rgba(34,197,94,0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    height: 56px;
  }
  .header h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .header h1 span { color: var(--accent); }
  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    color: var(--text2);
  }
  .live-dot {
    width: 8px; height: 8px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ── Layout ── */
  .main {
    display: grid;
    grid-template-columns: 1fr 380px;
    height: calc(100vh - 56px);
  }

  /* ── Map ── */
  #map {
    width: 100%;
    height: 100%;
  }

  /* ── Sidebar ── */
  .sidebar {
    background: var(--bg2);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 0;
  }

  .sidebar-section {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-section h2 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text2);
    margin-bottom: 12px;
  }

  /* ── Tabs ── */
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text2);
    border-bottom: 2px solid transparent;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    transition: all 0.2s;
  }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .tab:hover { color: var(--text); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ── Risk Cards ── */
  .risk-card {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .risk-card:hover { border-color: var(--accent); }
  .risk-card .rc-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .risk-card .rc-name { font-size: 14px; font-weight: 600; }
  .risk-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .risk-badge.CRITICAL { background: var(--critical-bg); color: var(--red); }
  .risk-badge.HIGH { background: var(--high-bg); color: var(--orange); }
  .risk-badge.MODERATE { background: var(--moderate-bg); color: var(--yellow); }
  .risk-badge.LOW { background: var(--low-bg); color: var(--green); }

  .rc-chain {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 8px;
  }
  .rc-chain .arrow { color: var(--accent); }

  .rc-bar-bg {
    height: 6px;
    background: var(--bg);
    border-radius: 3px;
    overflow: hidden;
  }
  .rc-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.5s ease;
  }

  .rc-score {
    font-size: 12px;
    color: var(--text2);
    margin-top: 4px;
    text-align: right;
  }

  /* ── Factor Breakdown ── */
  .factor-list { margin-top: 10px; }
  .factor-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    font-size: 12px;
  }
  .factor-label { flex: 1; color: var(--text2); }
  .factor-bar-bg {
    width: 80px;
    height: 4px;
    background: var(--bg);
    border-radius: 2px;
    overflow: hidden;
  }
  .factor-bar-fill { height: 100%; border-radius: 2px; }
  .factor-val { width: 36px; text-align: right; font-weight: 600; font-size: 11px; }

  /* ── Replay Panel ── */
  .replay-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .replay-btn {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .replay-btn:hover { opacity: 0.85; }
  .replay-btn.secondary {
    background: var(--bg3);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .replay-select {
    flex: 1;
    background: var(--bg3);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
  }

  .replay-step {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 10px;
    transition: all 0.3s;
  }
  .replay-step.active {
    border-color: var(--accent);
    background: rgba(56,189,248,0.05);
  }
  .replay-step .step-date {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .replay-step .step-label {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .replay-step .step-narrative {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.5;
    margin-bottom: 8px;
  }

  /* ── Score Timeline Chart ── */
  .chart-container {
    background: var(--bg3);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
  }

  /* ── Earthquake Feed ── */
  .eq-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .eq-mag {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    flex-shrink: 0;
  }
  .eq-details { flex: 1; }
  .eq-place { font-weight: 500; }
  .eq-time { font-size: 11px; color: var(--text2); }

  /* ── Loading ── */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    color: var(--text2);
    font-size: 14px;
  }
  .spinner {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Leaflet popup overrides ── */
  .leaflet-popup-content-wrapper {
    background: var(--bg2) !important;
    color: var(--text) !important;
    border-radius: 8px !important;
    border: 1px solid var(--border) !important;
  }
  .leaflet-popup-tip { background: var(--bg2) !important; }
  .leaflet-popup-content { font-size: 13px !important; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <h1><span>⟁</span> Cascade<span>Watch</span></h1>
  <div class="header-right">
    <div class="live-dot"></div>
    <span id="status-text">Connecting to data feeds…</span>
    <span id="clock"></span>
  </div>
</div>

<!-- Main Layout -->
<div class="main">
  <!-- Map -->
  <div id="map"></div>

  <!-- Sidebar -->
  <div class="sidebar">
    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="live">Live Monitor</button>
      <button class="tab" data-tab="replay">Historical Replay</button>
      <button class="tab" data-tab="quakes">Earthquakes</button>
    </div>

    <!-- Live Monitor Tab -->
    <div id="tab-live" class="tab-content active">
      <div class="sidebar-section">
        <h2>Select a Region</h2>
        <div id="region-list"></div>
      </div>
      <div id="risk-detail" class="sidebar-section" style="display:none;">
        <h2>Cascade Risk Analysis</h2>
        <div id="risk-cards"></div>
      </div>
    </div>

    <!-- Replay Tab -->
    <div id="tab-replay" class="tab-content">
      <div class="sidebar-section">
        <h2>Historical Event Replay</h2>
        <div class="replay-controls">
          <select class="replay-select" id="replay-select">
            <option value="">Choose an event…</option>
          </select>
          <button class="replay-btn" id="replay-btn" disabled>▶ Play</button>
        </div>
        <div id="replay-summary"></div>
        <div class="chart-container" id="replay-chart-container" style="display:none;">
          <canvas id="replay-chart" height="160"></canvas>
        </div>
        <div id="replay-steps"></div>
      </div>
    </div>

    <!-- Earthquakes Tab -->
    <div id="tab-quakes" class="tab-content">
      <div class="sidebar-section">
        <h2>Recent Earthquakes (7 days)</h2>
        <div id="quake-feed"><div class="loading"><div class="spinner"></div>Loading USGS data…</div></div>
      </div>
    </div>
  </div>
</div>

<script>
// ── State ──
let map, regionMarkers = {}, quakeMarkers = [], replayChart = null;

// ── Map Setup ──
function initMap() {
  map = L.map('map', { zoomControl: false }).setView([25, 50], 3);
  L.control.zoom({ position: 'topright' }).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap © CARTO',
    maxZoom: 18,
  }).addTo(map);
}

// ── Helpers ──
function levelColor(level) {
  return { CRITICAL: '#ef4444', HIGH: '#f59e0b', MODERATE: '#eab308', LOW: '#22c55e' }[level] || '#94a3b8';
}

function barColor(val) {
  if (val >= 0.8) return '#ef4444';
  if (val >= 0.6) return '#f59e0b';
  if (val >= 0.4) return '#eab308';
  return '#22c55e';
}

function magColor(mag) {
  if (mag >= 6) return '#ef4444';
  if (mag >= 5) return '#f59e0b';
  if (mag >= 4) return '#eab308';
  return '#22c55e';
}

function timeAgo(ts) {
  const mins = Math.floor((Date.now() - ts) / 60000);
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  return `${Math.floor(hrs / 24)}d ago`;
}

// ── Tabs ──
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
  });
});

// ── Load Regions ──
async function loadRegions() {
  const res = await fetch('/api/regions');
  const regions = await res.json();
  const list = document.getElementById('region-list');
  list.innerHTML = '';
  regions.forEach(r => {
    // Map marker
    const marker = L.circleMarker([r.lat, r.lon], {
      radius: 10, fillColor: '#38bdf8', color: '#1e3a5f',
      weight: 2, fillOpacity: 0.7
    }).addTo(map);
    marker.bindTooltip(r.name, { permanent: false, className: '' });
    marker.on('click', () => loadRegionRisk(r.id));
    regionMarkers[r.id] = marker;

    // Sidebar card
    const card = document.createElement('div');
    card.className = 'risk-card';
    card.innerHTML = `
      <div class="rc-header">
        <span class="rc-name">${r.name}</span>
        <span class="risk-badge LOW" id="badge-${r.id}">…</span>
      </div>
      <div style="font-size:12px;color:var(--text2);">${r.description}</div>
    `;
    card.addEventListener('click', () => loadRegionRisk(r.id));
    list.appendChild(card);
  });

  // Pre-load risk for all regions
  regions.forEach(r => loadRegionBadge(r.id));
}

async function loadRegionBadge(regionId) {
  try {
    const res = await fetch(`/api/regions/${regionId}/risk`);
    const data = await res.json();
    const badge = document.getElementById(`badge-${regionId}`);
    if (badge) {
      badge.textContent = data.highest_level;
      badge.className = `risk-badge ${data.highest_level}`;
    }
    // Update marker color
    const m = regionMarkers[regionId];
    if (m) {
      m.setStyle({ fillColor: levelColor(data.highest_level) });
    }
  } catch (e) {}
}

async function loadRegionRisk(regionId) {
  const detail = document.getElementById('risk-detail');
  const cards = document.getElementById('risk-cards');
  detail.style.display = 'block';
  cards.innerHTML = '<div class="loading"><div class="spinner"></div>Analyzing cascades…</div>';

  // Switch to live tab
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelector('[data-tab="live"]').classList.add('active');
  document.getElementById('tab-live').classList.add('active');

  const res = await fetch(`/api/regions/${regionId}/risk`);
  const data = await res.json();

  // Fly to region
  map.flyTo([data.region.lat, data.region.lon], 6, { duration: 1.2 });

  cards.innerHTML = '';
  data.cascade_risks.forEach(risk => {
    const card = document.createElement('div');
    card.className = 'risk-card';

    const chainHtml = risk.chain.map(c =>
      c.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())
    ).join(' <span class="arrow">→</span> ');

    let factorsHtml = '';
    Object.values(risk.factors).forEach(f => {
      const pct = Math.round(f.value * 100);
      factorsHtml += `
        <div class="factor-row">
          <span class="factor-label">${f.label}</span>
          <div class="factor-bar-bg">
            <div class="factor-bar-fill" style="width:${pct}%;background:${barColor(f.value)};"></div>
          </div>
          <span class="factor-val" style="color:${barColor(f.value)}">${pct}%</span>
        </div>
      `;
    });

    const scorePct = Math.round(risk.score * 100);
    card.innerHTML = `
      <div class="rc-header">
        <span class="rc-name">${risk.pattern_name}</span>
        <span class="risk-badge ${risk.level}">${risk.level}</span>
      </div>
      <div class="rc-chain">${chainHtml}</div>
      <div class="rc-bar-bg">
        <div class="rc-bar-fill" style="width:${scorePct}%;background:${levelColor(risk.level)};"></div>
      </div>
      <div class="rc-score">Score: ${risk.score.toFixed(3)} / threshold: ${risk.threshold}</div>
      <div class="factor-list">${factorsHtml}</div>
    `;
    cards.appendChild(card);
  });
}

// ── Earthquakes ──
async function loadEarthquakes() {
  const feed = document.getElementById('quake-feed');
  try {
    const res = await fetch('/api/earthquakes/recent');
    const quakes = await res.json();

    if (quakes.length && quakes[0].error) {
      feed.innerHTML = `<div style="color:var(--text2);padding:20px;font-size:13px;">Could not reach USGS API. Using offline mode.</div>`;
      return;
    }

    // Map markers
    quakeMarkers.forEach(m => map.removeLayer(m));
    quakeMarkers = [];
    quakes.forEach(q => {
      const m = L.circleMarker([q.lat, q.lon], {
        radius: Math.max(4, q.magnitude * 2.5),
        fillColor: magColor(q.magnitude),
        color: 'transparent',
        fillOpacity: 0.5,
      }).addTo(map);
      m.bindTooltip(`M${q.magnitude} — ${q.place}`, { className: '' });
      quakeMarkers.push(m);
    });

    feed.innerHTML = '';
    quakes.slice(0, 20).forEach(q => {
      const item = document.createElement('div');
      item.className = 'eq-item';
      item.innerHTML = `
        <div class="eq-mag" style="background:${magColor(q.magnitude)}22;color:${magColor(q.magnitude)};">
          ${q.magnitude.toFixed(1)}
        </div>
        <div class="eq-details">
          <div class="eq-place">${q.place || 'Unknown'}</div>
          <div class="eq-time">${timeAgo(q.time)} · Depth: ${q.depth_km.toFixed(1)} km</div>
        </div>
      `;
      feed.appendChild(item);
    });

    document.getElementById('status-text').textContent = `${quakes.length} earthquakes loaded · Live`;
  } catch (e) {
    feed.innerHTML = `<div style="color:var(--text2);padding:20px;font-size:13px;">Network error fetching earthquake data.</div>`;
  }
}

// ── Historical Replay ──
async function loadReplayEvents() {
  const select = document.getElementById('replay-select');
  const res = await fetch('/api/replay/events');
  const events = await res.json();
  events.forEach(ev => {
    const opt = document.createElement('option');
    opt.value = ev.id;
    opt.textContent = `${ev.name} (${ev.death_toll} deaths)`;
    select.appendChild(opt);
  });
}

document.getElementById('replay-select').addEventListener('change', async function () {
  const eventId = this.value;
  const btn = document.getElementById('replay-btn');
  btn.disabled = !eventId;
  if (!eventId) return;

  const res = await fetch(`/api/replay/${eventId}`);
  const data = await res.json();
  window._replayData = data;

  document.getElementById('replay-summary').innerHTML = `
    <div style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px;">
      <div style="font-size:15px;font-weight:700;margin-bottom:4px;">${data.name}</div>
      <div style="font-size:13px;color:var(--text2);line-height:1.5;">${data.summary}</div>
      <div style="font-size:13px;margin-top:6px;"><strong style="color:var(--red);">Death toll: ${data.death_toll}</strong></div>
    </div>
  `;

  // Build chart
  buildReplayChart(data);

  // Show steps (all collapsed initially)
  const stepsEl = document.getElementById('replay-steps');
  stepsEl.innerHTML = '';
  data.steps.forEach((step, i) => {
    const div = document.createElement('div');
    div.className = 'replay-step';
    div.id = `replay-step-${i}`;
    div.style.opacity = '0.4';

    // Top risk for this step
    const topRisk = step.cascade_risks[0];
    div.innerHTML = `
      <div class="step-date">${step.date}</div>
      <div class="step-label">${step.day_label}</div>
      <div style="margin-bottom:6px;">
        <span class="risk-badge ${step.highest_level}">${step.highest_level} — Score: ${(step.highest_score * 100).toFixed(0)}%</span>
      </div>
      <div class="step-narrative">${step.narrative}</div>
    `;
    stepsEl.appendChild(div);
  });

  // Fly to region
  map.flyTo([data.region.lat, data.region.lon], 7, { duration: 1.2 });
});

function buildReplayChart(data) {
  const container = document.getElementById('replay-chart-container');
  container.style.display = 'block';
  const ctx = document.getElementById('replay-chart').getContext('2d');

  if (replayChart) replayChart.destroy();

  const labels = data.steps.map(s => s.date);
  const scores = data.steps.map(s => s.highest_score);
  const threshold = data.steps[0]?.cascade_risks[0]?.threshold || 0.7;

  replayChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'Cascade Risk Score',
          data: scores,
          borderColor: '#38bdf8',
          backgroundColor: 'rgba(56,189,248,0.1)',
          fill: true,
          tension: 0.3,
          pointRadius: 5,
          pointBackgroundColor: scores.map(s =>
            s >= threshold + 0.15 ? '#ef4444' :
            s >= threshold ? '#f59e0b' :
            s >= threshold - 0.15 ? '#eab308' : '#22c55e'
          ),
          pointBorderColor: 'transparent',
        },
        {
          label: 'Alert Threshold',
          data: labels.map(() => threshold),
          borderColor: '#ef444466',
          borderDash: [6, 4],
          pointRadius: 0,
          fill: false,
        }
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { color: '#1e2d3d' } },
        y: { min: 0, max: 1, ticks: { color: '#94a3b8', font: { size: 10 }, callback: v => (v * 100) + '%' }, grid: { color: '#1e2d3d' } },
      },
      plugins: {
        legend: { display: true, labels: { color: '#94a3b8', font: { size: 11 } } },
      },
    },
  });
}

// Play replay animation
document.getElementById('replay-btn').addEventListener('click', async () => {
  const data = window._replayData;
  if (!data) return;

  const btn = document.getElementById('replay-btn');
  btn.disabled = true;
  btn.textContent = '⏸ Playing…';

  for (let i = 0; i < data.steps.length; i++) {
    // Highlight current step
    document.querySelectorAll('.replay-step').forEach(s => {
      s.classList.remove('active');
      s.style.opacity = '0.4';
    });

    for (let j = 0; j <= i; j++) {
      const el = document.getElementById(`replay-step-${j}`);
      el.style.opacity = '1';
      if (j === i) el.classList.add('active');
    }

    // Update chart highlight
    if (replayChart) {
      const pointColors = data.steps.map((s, idx) => {
        if (idx > i) return 'transparent';
        const score = s.highest_score;
        const threshold = s.cascade_risks[0]?.threshold || 0.7;
        if (score >= threshold + 0.15) return '#ef4444';
        if (score >= threshold) return '#f59e0b';
        if (score >= threshold - 0.15) return '#eab308';
        return '#22c55e';
      });
      replayChart.data.datasets[0].pointBackgroundColor = pointColors;
      replayChart.data.datasets[0].pointRadius = data.steps.map((_, idx) => idx <= i ? 6 : 3);
      replayChart.update();
    }

    // Scroll into view
    const el = document.getElementById(`replay-step-${i}`);
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });

    // Pulse marker on map
    const step = data.steps[i];
    const pulseColor = levelColor(step.highest_level);
    const pulse = L.circleMarker([data.region.lat, data.region.lon], {
      radius: 20, fillColor: pulseColor, color: pulseColor,
      weight: 2, fillOpacity: 0.3,
    }).addTo(map);
    setTimeout(() => map.removeLayer(pulse), 1500);

    await new Promise(resolve => setTimeout(resolve, 2500));
  }

  btn.disabled = false;
  btn.textContent = '▶ Replay';
});

// ── Clock ──
function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString();
}

// ── Init ──
async function init() {
  initMap();
  updateClock();
  setInterval(updateClock, 1000);

  await Promise.all([
    loadRegions(),
    loadEarthquakes(),
    loadReplayEvents(),
  ]);
}

init();
</script>
